name: Build Windows Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Opt the Node-20 actions (checkout, upload-artifact) into the Node 24
# runtime before the 2026-06-02 forced cutover. Workflow-level so every
# action moves at once.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install LLVM (for bindgen/mupdf)
        run: choco install llvm -y

      - name: Build Release
        env:
          LIBCLANG_PATH: "C:\\Program Files\\LLVM\\lib"
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Prepare artifact
        run: |
          mkdir dist
          copy target\x86_64-pc-windows-msvc\release\pdf-reader.exe dist\SimplePDFReader.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SimplePDFReader-windows-x64
          path: dist/SimplePDFReader.exe
