[package]
name = "simple-pdf-reader"
version = "0.1.0"
edition = "2021"
description = "Simple portable PDF reader based on MuPDF + egui"
license = "AGPL-3.0"

[[bin]]
name = "SimplePDFReader"
path = "src/main.rs"

[dependencies]
# GUI
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
egui = "0.33"

# PDF backend (patched for Windows MSVC max_align_t)
mupdf = "0.6"

# File dialog
rfd = "0.17"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Clipboard
arboard = "3"

# Image loading (for window icon)
image = { version = "0.25", default-features = false, features = ["png"] }

# Error handling
anyhow = "1"

# Open URLs in system browser
open = "5"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
panic = "abort"
